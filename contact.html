  <script>
    (function(){
      function genPngFromSvgUrl(svgUrl,size,cb){
        var img=new Image();
        img.onload=function(){
          var c=document.createElement('canvas');c.width=size;c.height=size;
          var ctx=c.getContext('2d');ctx.clearRect(0,0,size,size);
          ctx.drawImage(img,0,0,size,size);
          try{cb(c.toDataURL('image/png'));}catch(e){cb(null);}        };
        img.onerror=function(){cb(null);} ;
        img.src=svgUrl;
      }
      var svgHref=(document.querySelector('link[rel="icon"]')||{}).href||'public/images/logoah.svg';
      var sizes=[16,32,64,128,256,512];
      sizes.forEach(function(s){
        genPngFromSvgUrl(svgHref,s,function(dataUrl){
          if(!dataUrl) return;
          var l=document.createElement('link');l.rel='icon';l.type='image/png';l.sizes=s+'x'+s;l.href=dataUrl;document.head.appendChild(l);
          if(s===32){var sh=document.createElement('link');sh.rel='shortcut icon';sh.href=dataUrl;document.head.appendChild(sh);}
        });
      });
    })();
  </script>
